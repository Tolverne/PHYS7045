name: Render exam diagram pages

on:
  push:
    branches: [main]
    paths:
      - scripts/render_exam_diagrams.py
      - .github/workflows/render-exam-diagrams.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pymupdf
      - run: python scripts/render_exam_diagrams.py
      - name: Commit diagram previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam_prep/source_extractions/diagram_pages/
          if ! git diff --cached --quiet; then
            git commit -m "Render original exam figure pages for solution verification"
            git push
          fi
