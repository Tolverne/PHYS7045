name: Build PHYS7045 assignment formula and methods sheet

on:
  push:
    branches: [main]
    paths:
      - 'exam_prep/assignment_formula_methods/*.tex'
      - '.github/workflows/build-assignment-formula-methods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile five-page assignment methods PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: exam_prep/assignment_formula_methods
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error
      - name: Publish the printable PDF
        run: |
          cp exam_prep/assignment_formula_methods/main.pdf exam_prep/assignment_formula_methods/PHYS7045_Assignments_Formula_and_Methods_5pp.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam_prep/assignment_formula_methods/PHYS7045_Assignments_Formula_and_Methods_5pp.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Publish PHYS7045 assignment methods PDF'
            git push
          fi