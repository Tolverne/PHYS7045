name: Extract text for exam source audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-exam-text.yml"
      - "scripts/extract_exam_text.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install text extraction library
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Extract exam and assignment text
        run: python scripts/extract_exam_text.py
      - name: Commit searchable extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exam_prep/source_extractions
          if ! git diff --cached --quiet; then
            git commit -m "Extract searchable exam and assignment text for revision"
            git push
          fi
