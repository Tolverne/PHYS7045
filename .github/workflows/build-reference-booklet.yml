name: Build printable PHYS7045 course overview

on:
  push:
    branches: [main]
    paths:
      - 'exam_prep/reference_booklet/**.tex'
      - '.github/workflows/build-reference-booklet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LaTeX PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: exam_prep/reference_booklet
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error
      - name: Publish the printable PDF
        run: |
          cp exam_prep/reference_booklet/main.pdf exam_prep/reference_booklet/PHYS7045_Part1_Course_Overview.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam_prep/reference_booklet/PHYS7045_Part1_Course_Overview.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Build PHYS7045 Part I course overview PDF'
            git push
          fi